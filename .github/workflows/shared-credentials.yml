name: Shared credentials

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/crypto/**'
      - 'crates/engine/**'
      - 'crates/harness/**'
      - 'crates/rpc/**'
      - 'edge/**'
      - '.github/workflows/shared-credentials.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/crypto/**'
      - 'crates/engine/**'
      - 'crates/harness/**'
      - 'crates/rpc/**'
      - 'edge/**'
      - '.github/workflows/shared-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: edge
      - name: Crypto and launch isolation
        run: |
          cargo test --locked -p zeron-crypto
          cargo test --locked -p zeron-harness runtime_auth --lib
      - name: Edge validation and real worker multi-device tests
        working-directory: edge
        run: |
          npm run typecheck
          npm test
          npm run test:credentials
